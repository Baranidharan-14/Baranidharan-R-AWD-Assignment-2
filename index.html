<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎵 Music Player</h1>

  
  <div class="filters">
    <input type="text" id="searchBar" placeholder="Search songs...">

    <select id="genreFilter">
      <option value="all">All Genres</option>
      <option value="Pop">Pop</option>
      <option value="Rock">Rock</option>
      <option value="Hip-Hop">Hip-Hop</option>
    </select>

    <select id="artistFilter">
      <option value="all">All Artists</option>
    </select>

    <button onclick="sortBy('title')">Sort by Title</button>
    <button onclick="sortBy('playCount')">Sort by Plays</button>
  </div>

  
  <div id="playlist" class="grid"></div>

  
  <div class="now-playing">
    <h2>Now Playing</h2>
    <p id="nowPlaying">None</p>
  </div>

  
  <div class="recent">
    <h2>Recently Played</h2>
    <ul id="recentList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
